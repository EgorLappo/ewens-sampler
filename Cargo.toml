[package]
name = "ewens-sampler"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.5.49", features = ["derive"] }
color-eyre = "0.6.5"
indicatif = "0.18.0"
itertools = "0.15.0"
rand = { version = "0.10.1" }
rand_pcg = "0.10.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.151"

[dev-dependencies]
criterion = "0.8"

[[bench]]
name = "sampling"
harness = false

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
